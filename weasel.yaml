# Weasel settings
config_version: "2024-03-02"

# 应用兼容配置
app_options:
  firefox.exe: { inline_preedit: true }
  iexplore.exe: { inline_preedit: true }
  browser.exe: { inline_preedit: true }

# 全局基础设置
show_notifications: true
show_notifications_time: 1200
global_ascii: false

# 核心样式配置（横行+蓝水鸭主题）
style:
  color_scheme: mint_light_blue
  color_scheme_dark: mint_light_blue
  
  # 字体配置
  font_face: "Segoe UI Emoji, Microsoft YaHei, SF Pro, Noto Color Emoji"
  label_font_face: "Microsoft YaHei"
  comment_font_face: "Microsoft YaHei"
  font_point: 12
  label_font_point: 12
  comment_font_point: 10

  # 横行排列核心参数
  candidate_list_layout: linear
  horizontal: true
  
  # 基础行为配置（保留必需项）
  inline_preedit: false
  preedit_type: composition
  fullscreen: false
  vertical_text: false
  label_format: "%s"
  mark_text: "|"
  enhanced_position: true
  display_tray_icon: false
  antialias_mode: default
  candidate_abbreviate_length: 30
  hover_type: none
  paging_on_scroll: true

  # 布局尺寸（适配横行）
  layout:
    align_type: center
    max_height: 600
    max_width: 800
    min_width: 145
    border_width: 0
    margin_x: 8
    margin_y: 8
    spacing: 10
    candidate_spacing: 22
    hilite_spacing: 6
    hilite_padding: 8
    shadow_radius: 0
    corner_radius: 8
    round_corner: 8

# 主题
preset_color_schemes:
  mint_light_blue:
    name: "LaiJiang／Mint Light Blue"
    color_format: abgr
    # 基础配色
    text_color: 0x6495ed
    back_color: 0xefefef
    label_color: 0xcac9c8
    border_color: 0xefefef
    shadow_color: 0xb4000000
    comment_text_color: 0xcac9c8
    candidate_text_color: 0x424242
    # 高亮配色
    hilited_text_color: 0xed9564
    hilited_back_color: 0xefefef
    hilited_candidate_back_color: 0xed9564
    hilited_candidate_text_color: 0xefefef
    hilited_candidate_label_color: 0xcac9c8
    hilited_label_color: 0xcac9c8
    hilited_comment_text_color: 0xefefef
    # 必需补充项
    candidate_back_color: 0xefefef
    hilited_mark_color: 0xed9564
    nextpage_color: 0x6495ed
    prevpage_color: 0x6495ed